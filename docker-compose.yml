services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pocket_buddy
      POSTGRES_USER: pocket_buddy
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocket_buddy -d pocket_buddy"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
  api:
    build: ./services/api
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://pocket_buddy:local_dev_only@db:5432/pocket_buddy?sslmode=disable
      WEB_ORIGIN: http://localhost:3000
      MAILPIT_HOST: mailpit
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
  web:
    image: node:22-alpine
    working_dir: /workspace/apps/web
    command: sh -c "npm install && npm run dev"
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/node_modules
      - web_next_dev:/workspace/apps/web/.next-dev
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - api
volumes:
  pgdata:
  web_node_modules:
  web_next_dev:
